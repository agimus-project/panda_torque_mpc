    rotation: [0, 0, 0, 1] #qx,qy,qz,qw  


collision_pairs: 
    - ["panda_rightfinger_0", "obstacle1"]
    - ["panda_leftfinger_0", "obstacle1"]
    - ["panda_rightfinger_0", "obstacle2"]
    - ["panda_leftfinger_0", "obstacle2"]


